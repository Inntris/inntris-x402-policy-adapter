name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INNTRIS_TEST_POSTGRES_URL: postgresql://inntris:inntris-test@localhost:5432/inntris_test
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: inntris
          POSTGRES_PASSWORD: inntris-test
          POSTGRES_DB: inntris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inntris -d inntris_test" --health-interval 5s --health-timeout
          5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.18.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install pinned official AP2 SDK
        run: >-
          python -m pip install
          "git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43"

      - name: Apply audited AP2 dependency overrides
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --upgrade \
            -r packages/ap2-runtime-gate/python/security-overrides.txt
          python -m pip_audit

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Official AP2 SDK self test
        run: pnpm test:ap2-official

      - name: Independent Pulse evaluator tests
        run: pnpm test:pulse

      - name: Integration tests
        run: pnpm test:integration

      - name: KYA authority tests
        run: pnpm test:kya

      - name: Multi-rail conformance
        run: pnpm conformance

      - name: KYA authority conformance
        run: pnpm conformance:kya

      - name: Build
        run: pnpm build

      - name: Verify committed evidence
        run: |
          pnpm evidence:verify
          pnpm evidence:kya:verify

      - name: Reproduce schemas and evidence
        run: |
          pnpm schemas:generate
          pnpm evidence:generate
          pnpm evidence:kya:generate
          git diff --exit-code -- schemas fixtures evidence

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
